version: '1.0'
name: simurg-reader-web-pipeline
displayName: 'Simurg Reader Web CI/CD 流水线'
triggers:
  push:
    branches:
      precise:
        - master
        - feature-1.0
stages:
  - name: build-stage
    displayName: '云端构建与打包'
    strategy: naturally
    trigger: auto
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: 'Node.js 构建与打包'
        nodeVersion: 20
        commands:
          # 1. 配置国内淘宝镜像源，彻底避免从国外 npm 源拉取超时
          - npm config set registry https://registry.npmmirror.com
          # 2. 使用 npx 安全执行 pnpm（免全局提权安装，彻底规避 EACCES 权限拦截）
          - npx -y pnpm@9 install
          # 3. 动态注入生产环境变量
          - echo "NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://www.sr-web-test.tata.org.cn:8082/api}" > .env.production
          # 4. 执行生产打包（Nuxt 编译生成 .output 并自动打包为 .output.tar.gz）
          - npx -y pnpm@9 run build:prod
        artifacts:
          - name: output
            path:
              - .output.tar.gz

  - name: deploy-stage
    displayName: '发布部署至宝塔服务器'
    strategy: naturally
    trigger: auto
    steps:
      - step: deploy@agent
        name: deploy_agent
        displayName: '主机部署与平滑重载'
        hostGroupID: default
        deployArtifact:
          - source: build
            name: output
            target: /www/wwwroot/simurg-reader-web
            dependArtifact: output
        script: |
          cd /www/wwwroot/simurg-reader-web
          # 1. 自动快照备份当前版本
          if [ -d ".output" ]; then
            mkdir -p backups
            cp -r .output "backups/output_$(date +%Y%m%d_%H%M%S)"
            cd backups && ls -td output_* 2>/dev/null | tail -n +4 | xargs -r rm -rf && cd ..
          fi

          # 2. 解压新版本并清理压缩包
          tar -zxf output.tar.gz || tar -zxf .output.tar.gz || true
          rm -f output.tar.gz .output.tar.gz

          # 3. PM2 零停机平滑重载
          pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs

          # 4. 本地端口健康检查
          sleep 3
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001 || true
