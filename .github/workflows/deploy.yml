name: Simurg Reader Web CI/CD

on:
  push:
    branches:
      - master
      - feature-1.0
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 启用 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: 安装依赖
        run: |
          pnpm install --no-frozen-lockfile

      - name: 注入生产环境变量
        run: |
          echo "NUXT_PUBLIC_API_BASE=http://www.sr-web-test.tata.org.cn:8082/api" > .env.production

      - name: 云端编译并打包 Nuxt SSR 产物
        run: |
          pnpm run build:prod

      - name: 安全上传产物包至宝塔服务器 (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "111.228.38.154"
          username: "root"
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: ".output.tar.gz"
          target: "/www/wwwroot/simurg-reader-web"

      - name: 触发服务器平滑重载与健康检查 (SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "111.228.38.154"
          username: "root"
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /www/wwwroot/simurg-reader-web
            # 1. 自动快照备份当前旧版本（若存在）
            if [ -d ".output" ]; then
              mkdir -p backups
              BACKUP_DIR="backups/output_$(date +%Y%m%d_%H%M%S)"
              echo "==> 正在创建版本快照: $BACKUP_DIR"
              cp -r .output "$BACKUP_DIR"
              # 保留最近 3 个历史备份，自动清理更早的历史
              cd backups && ls -td output_* 2>/dev/null | tail -n +4 | xargs -r rm -rf && cd ..
            fi

            # 2. 解压新版本并清理压缩包
            echo "==> 正在解压最新构建产物..."
            tar -zxf .output.tar.gz
            rm -f .output.tar.gz

            # 3. PM2 零停机平滑重载 (Zero Downtime)
            echo "==> 触发 PM2 平滑重载..."
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs

            # 4. 服务健康探测自检
            sleep 3
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001 || true)
            echo "==> 本地端口健康检查: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ]; then
              echo "==> 恭喜，GitHub Actions 自动化部署成功上线！"
            else
              echo "==> [提示] 请检查服务实时日志: pm2 logs simurg-reader-web"
            fi
